<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecScan{% block title %}{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#1c2128;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --accent:  #f85149;
      --green:   #3fb950;
      --yellow:  #d29922;
      --blue:    #388bfd;
      --purple:  #bc8cff;
      --mono:    'Consolas', 'Monaco', monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      height: 52px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-brand {
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .nav-brand span { color: var(--text); }
    nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      transition: color .15s;
    }
    nav a:hover { color: var(--text); }
    .nav-spacer { flex: 1; }
    .nav-pill {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(248,81,73,0.15);
      color: var(--accent);
    }

    main { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    h2 { font-size: 17px; font-weight: 600; margin-bottom: 12px; margin-top: 28px; }
    h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    p  { color: var(--muted); line-height: 1.7; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: .03em;
    }
    .badge-high   { background: rgba(248,81,73,.2);  color: #f85149; }
    .badge-medium { background: rgba(210,153,34,.2); color: #e6a817; }
    .badge-low    { background: rgba(56,139,253,.2); color: #79c0ff; }
    .badge-ok     { background: rgba(63,185,80,.2);  color: #3fb950; }
    .badge-info   { background: rgba(188,140,255,.2);color: #bc8cff; }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      text-decoration: none;
      transition: all .15s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #da3b35; border-color: #da3b35; }
    .btn-green {
      background: rgba(63,185,80,.15);
      border-color: rgba(63,185,80,.4);
      color: var(--green);
    }
    .btn-green:hover { background: rgba(63,185,80,.25); }

    select, input[type="text"], input[type="file"] {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      width: 100%;
      outline: none;
      transition: border-color .15s;
    }
    select:focus, input[type="text"]:focus { border-color: var(--blue); }

    code, pre {
      font-family: var(--mono);
      font-size: 12px;
    }
    pre {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
      overflow-x: auto;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-all;
    }
    .inline-code {
      background: rgba(88,166,255,.1);
      color: #79c0ff;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: var(--mono);
      font-size: 12px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .metric-card .num  { font-size: 28px; font-weight: 700; }
    .metric-card .lbl  { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .alert {
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .alert-danger  { background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.3);  color: #f85149; }
    .alert-success { background: rgba(63,185,80,.12); border: 1px solid rgba(63,185,80,.3);  color: #3fb950; }
    .alert-info    { background: rgba(56,139,253,.12);border: 1px solid rgba(56,139,253,.3); color: #79c0ff; }
    .alert-warn    { background: rgba(210,153,34,.12);border: 1px solid rgba(210,153,34,.3); color: #e6a817; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--surface2);
      text-align: left;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    tbody td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    tbody tr:hover td { background: var(--surface2); }
    tbody tr:last-child td { border-bottom: none; }

    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
    }
    .tag-vuln { background: rgba(248,81,73,.1); border-color: rgba(248,81,73,.3); color: #f85149; }
    .tag-safe { background: rgba(63,185,80,.1); border-color: rgba(63,185,80,.3); color: #3fb950; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 24px;
      margin-top: 48px;
      border-top: 1px solid var(--border);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav>
  <a class="nav-brand" href="/"><span>Sec</span>Scan</a>
  {% if session.get('parsed_data') %}
  <a href="{{ url_for('overview') }}">Overview</a>
  <a href="{{ url_for('tables') }}">Inject</a>
  <a href="{{ url_for('download_report', fmt='html') }}">Report ↓</a>
  {% endif %}
  <div class="nav-spacer"></div>
  <span class="nav-pill">v2.0</span>
  {% if session.get('parsed_data') %}
  <a href="{{ url_for('reset') }}" style="color:var(--muted);font-size:12px;">New scan</a>
  {% endif %}
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>SecScan v2.0 — Educational SQL Injection Simulation Tool</footer>
</body>
</html>
